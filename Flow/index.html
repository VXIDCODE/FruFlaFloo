<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Flow</title>
<style>
  :root {
    --ctp-base:#1e1e2e; --ctp-mantle:#181825; --ctp-crust:#11111b;
    --ctp-surface0:#313244; --ctp-surface1:#45475a; --ctp-surface2:#585b70;
    --ctp-overlay0:#6c7086; --ctp-overlay1:#7f849c;
    --ctp-text:#cdd6f4; --ctp-subtext0:#a6adc8; --ctp-subtext1:#bac2de;
    --ctp-green:#a6e3a1; --ctp-teal:#94e2d5; --ctp-sky:#89dceb;
    --ctp-blue:#89b4fa; --ctp-lavender:#b4befe; --ctp-mauve:#cba6f7;
    --ctp-pink:#f5c2e7; --ctp-red:#f38ba8; --ctp-peach:#fab387; --ctp-yellow:#f9e2af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: var(--ctp-crust);
    font-family: "JetBrains Mono","Fira Code","SF Mono",Consolas,monospace;
    color: var(--ctp-text);
  }

  /* ---------- ФОН ---------- */
  .bg-layer { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .grid {
    position: absolute; inset: -10%;
    background-image:
      linear-gradient(rgba(137,180,250,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(137,180,250,0.08) 1px, transparent 1px);
    background-size: 48px 48px;
    transform: perspective(600px) rotateX(58deg);
    transform-origin: center bottom;
    animation: gridScroll 24s linear infinite;
    mask-image: radial-gradient(ellipse at 50% 60%, #000 10%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 60%, #000 10%, transparent 75%);
  }
  @keyframes gridScroll {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 48px, 48px 0; }
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; animation: float 18s ease-in-out infinite; }
  .glow.a { width: 480px; height: 480px; background: var(--ctp-mauve); top: -160px; left: -120px; }
  .glow.b { width: 420px; height: 420px; background: var(--ctp-sky); bottom: -140px; right: -120px; animation-delay: -6s; }
  .glow.c { width: 360px; height: 360px; background: var(--ctp-pink); top: 40%; left: 60%; animation-delay: -12s; opacity: 0.35; }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(40px,-30px) scale(1.15); }
  }
  .scanlines-bg {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px,
      transparent 1px, transparent 3px);
    opacity: 0.5;
  }
  .noise {
    position: absolute; inset: 0; opacity: 0.06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }

  /* ---------- РАМКА ОКНА ---------- */
  .stage-wrap {
    position: relative; z-index: 2;
    height: 100vh; padding: 4vh 6vw;
    display: flex; align-items: center; justify-content: center;
  }
  .stage-frame {
    width: 100%; height: 82vh;
    background: rgba(24,24,37,0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--ctp-surface1);
    border-radius: 12px;
    box-shadow:
      0 0 0 1px rgba(203,166,247,0.15),
      0 20px 60px rgba(0,0,0,0.6),
      0 0 80px rgba(137,180,250,0.15),
      inset 0 0 120px rgba(203,166,247,0.05);
    display: flex; flex-direction: column;
    overflow: hidden; position: relative;
    animation: bootIn 0.8s ease-out;
  }
  @keyframes bootIn {
    from { opacity: 0; transform: scale(0.96) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .titlebar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: linear-gradient(180deg, var(--ctp-surface0), var(--ctp-mantle));
    border-bottom: 1px solid var(--ctp-surface1);
    user-select: none; flex-shrink: 0;
  }
  .dots { display: flex; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: var(--ctp-red); }
  .dot.y { background: var(--ctp-yellow); }
  .dot.g { background: var(--ctp-green); }

  .title {
    flex: 1; text-align: center;
    color: var(--ctp-subtext0);
    font-size: 12px; letter-spacing: 0.08em; text-transform: lowercase;
  }
  .title .path { color: var(--ctp-mauve); }
  .title .sep  { color: var(--ctp-overlay0); }

  .status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ctp-green); letter-spacing: 0.05em; }
  .status .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ctp-green);
    box-shadow: 0 0 10px var(--ctp-green);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: 0.4; transform: scale(0.7); }
  }
  .status.tx .pulse { background: var(--ctp-yellow); box-shadow: 0 0 10px var(--ctp-yellow); }
  .status.done .pulse { background: var(--ctp-green); box-shadow: 0 0 10px var(--ctp-green); }

  /* ---------- СЦЕНА ---------- */
  .stage {
    flex: 1; position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 50%, rgba(203,166,247,0.05), transparent 65%),
      var(--ctp-base);
  }
  .flow-layer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }
  .node-layer {
    position: absolute; inset: 0; z-index: 2;
  }

  /* ---------- УЗЕЛ БЛОКСХЕМЫ ---------- */
  .node {
    position: absolute;
    transform: translate(-50%, -50%);
    opacity: 0;
    --node-color: var(--ctp-mauve);
    --node-color-glow: rgba(203,166,247,0.45);
  }
  .node.show { animation: nodeIn 0.5s cubic-bezier(.2,.9,.3,1.25) forwards; }
  @keyframes nodeIn {
    from { opacity: 0; transform: translate(-50%,-50%) scale(0.68); }
    to   { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  }

  .node-window {
    width: 250px;
    background: linear-gradient(180deg, rgba(42,42,58,0.92), rgba(26,26,40,0.95));
    border: 1.5px solid var(--node-color);
    border-radius: 10px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.45),
      0 0 26px var(--node-color-glow),
      0 14px 36px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.05);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .node-bar {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 10px;
    background: linear-gradient(180deg, var(--ctp-surface0), var(--ctp-mantle));
    border-bottom: 1px solid var(--ctp-surface1);
  }
  .nb-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ctp-surface2); opacity: 0.75; }
  .nb-dot:nth-child(1) { background: var(--ctp-red); }
  .nb-dot:nth-child(2) { background: var(--ctp-yellow); }
  .nb-dot:nth-child(3) { background: var(--ctp-green); }

  .node-title {
    flex: 1; text-align: center;
    padding-right: 21px;
    font-size: 10px; letter-spacing: 0.12em;
    text-transform: lowercase;
    color: var(--node-color);
    text-shadow: 0 0 10px var(--node-color-glow);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .node-body {
    padding: 10px 12px 12px;
    min-height: 46px;
  }
  .node-line {
    font-size: 11px;
    line-height: 1.65;
    letter-spacing: 0.02em;
    color: var(--ctp-subtext1);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .node-line:first-child {
    font-size: 12px;
    color: var(--node-color);
    text-shadow: 0 0 10px var(--node-color-glow);
  }
  .ch { opacity: 0; }
  .ch.on { opacity: 1; }

  .caret {
    display: inline-block;
    width: 0; height: 1em;
    border-left: 2px solid var(--node-color);
    margin-right: -2px;
    vertical-align: -0.15em;
    box-shadow: 0 0 8px var(--node-color-glow);
    animation: blink 0.7s steps(1, end) infinite;
  }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

  /* ---------- CRT ---------- */
  .crt {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode: multiply;
    animation: flicker 0.15s infinite;
  }
  @keyframes flicker { 0%{opacity:.92;} 50%{opacity:1;} 100%{opacity:.95;} }

  .vignette {
    position: fixed; inset: 0; z-index: 11; pointer-events: none;
    background: radial-gradient(ellipse at center,
      transparent 40%, rgba(0,0,0,0.35) 85%, rgba(0,0,0,0.75) 100%);
  }
  .beam {
    position: fixed; left: 0; right: 0; height: 120px; z-index: 12; pointer-events: none;
    background: linear-gradient(to bottom, transparent,
      rgba(137,180,250,0.06), rgba(203,166,247,0.10),
      rgba(137,180,250,0.06), transparent);
    animation: beamMove 7s linear infinite;
  }
  @keyframes beamMove { 0%{top:-20%;} 100%{top:110%;} }

  /* ---------- EMPTY ---------- */
  .empty {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    color: var(--ctp-overlay0); font-size: 13px;
    text-align: center; padding: 40px;
  }
  .empty .big { font-size: 42px; color: var(--ctp-mauve); filter: drop-shadow(0 0 20px var(--ctp-mauve)); margin-bottom: 8px; }
  .empty .accent { color: var(--ctp-green); }
  .empty pre {
    text-align: left;
    color: var(--ctp-subtext0);
    font-size: 12px;
    margin-top: 14px;
    background: rgba(0,0,0,0.25);
    padding: 14px 18px;
    border-radius: 8px;
    border: 1px solid var(--ctp-surface1);
  }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="glow c"></div>
  <div class="grid"></div>
  <div class="scanlines-bg"></div>
  <div class="noise"></div>
</div>

<div class="stage-wrap">
  <div class="stage-frame">
    <div class="titlebar">
      <div class="dots">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      </div>
      <div class="title">
        <span class="path">@artem.grachev</span>
        <span class="sep">:</span>
        <span class="path">~/flow</span>
        <span class="sep">$</span>
        <span>tail -f flow.log</span>
      </div>
      <div class="status" id="status">
        <span class="pulse"></span>
        <span id="statusText">online</span>
      </div>
    </div>

    <div class="stage" id="stage">
      <svg class="flow-layer" id="flowLayer" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="node-layer" id="nodeLayer"></div>
    </div>
  </div>
</div>

<div class="crt"></div>
<div class="vignette"></div>
<div class="beam"></div>

<!-- Данные -->
<script src="data.js"></script>

<!-- Логика -->
<script>
  const stage      = document.getElementById('stage');
  const nodeLayer  = document.getElementById('nodeLayer');
  const flowLayer  = document.getElementById('flowLayer');
  const statusEl   = document.getElementById('status');
  const statusText = document.getElementById('statusText');

  const SVGNS = 'http://www.w3.org/2000/svg';

  /* ================= НАСТРОЙКИ ================= */
  const CONFIG = {
    nodeAppear:    520,   // появление окна
    beforeType:    180,   // пауза перед печатью текста
    typeSpeed:      22,   // скорость печати символа
    linePause:     150,   // пауза между строками
    arrowDelay:    220,   // пауза перед стрелкой
    arrowDuration: 620,   // прорисовка стрелки
    arrowHold:     260    // пауза после стрелки
  };

  const PALETTE = ['mauve','green','sky','peach','pink','teal','lavender','yellow','blue','red'];

  /* ================= УТИЛИТЫ ================= */
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const raf   = () => new Promise(r => requestAnimationFrame(r));

  const easeInOutCubic = t =>
    t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

  function hexToRgba(hex, a) {
    const h = hex.replace('#','');
    const r = parseInt(h.substring(0,2),16);
    const g = parseInt(h.substring(2,4),16);
    const b = parseInt(h.substring(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function getCtpColor(name) {
    const v = getComputedStyle(document.documentElement)
      .getPropertyValue('--ctp-' + name).trim();
    return v || '#cba6f7';
  }

  /* ================= ПОСТРОЕНИЕ ОКНА ================= */
  function buildNode(spec, index) {
    const colorName = (spec.color && /^[a-z]+$/i.test(spec.color))
      ? spec.color.toLowerCase()
      : PALETTE[index % PALETTE.length];
    const hex  = getCtpColor(colorName);
    const glow = hexToRgba(hex, 0.45);

    const el = document.createElement('div');
    el.className = 'node';
    el.style.left = (typeof spec.x === 'number' ? spec.x : 50) + '%';
    el.style.top  = (typeof spec.y === 'number' ? spec.y : 50) + '%';
    el.style.setProperty('--node-color', hex);
    el.style.setProperty('--node-color-glow', glow);
    el.__hex  = hex;
    el.__glow = glow;

    const win = document.createElement('div');
    win.className = 'node-window';

    const bar = document.createElement('div');
    bar.className = 'node-bar';
    for (let i = 0; i < 3; i++) {
      const d = document.createElement('span');
      d.className = 'nb-dot';
      bar.appendChild(d);
    }
    const ttl = document.createElement('div');
    ttl.className = 'node-title';
    ttl.textContent = spec.title || ('node-' + String(index + 1).padStart(2, '0'));
    bar.appendChild(ttl);

    const body = document.createElement('div');
    body.className = 'node-body';

    const raw = Array.isArray(spec.text)
      ? spec.text
      : [spec.text != null ? spec.text : ''];

    raw.forEach(lineText => {
      const line = document.createElement('div');
      line.className = 'node-line';
      [...String(lineText)].forEach(ch => {
        const s = document.createElement('span');
        s.className = 'ch';
        s.textContent = ch === ' ' ? '\u00A0' : ch;
        line.appendChild(s);
      });
      body.appendChild(line);
    });

    win.appendChild(bar);
    win.appendChild(body);
    el.appendChild(win);
    return el;
  }

  /* ================= ПЕЧАТЬ ТЕКСТА ================= */
  async function typeNode(el) {
    const lines = el.querySelectorAll('.node-line');

    for (const line of lines) {
      const chars = line.querySelectorAll('.ch');
      const caret = document.createElement('span');
      caret.className = 'caret';
      line.appendChild(caret);

      for (const ch of chars) {
        if (skipRequested) break;
        ch.classList.add('on');
        ch.after(caret);
        await sleep(CONFIG.typeSpeed);
      }

      if (skipRequested) chars.forEach(c => c.classList.add('on'));
      caret.remove();
      if (!skipRequested) await sleep(CONFIG.linePause);
    }
  }

  /* ================= ГЕОМЕТРИЯ ================= */
  function rectOf(el, sr) {
    const r = el.getBoundingClientRect();
    return {
      left:   r.left - sr.left,
      top:    r.top  - sr.top,
      width:  r.width,
      height: r.height
    };
  }

  function borderPoint(r, tx, ty) {
    const cx = r.left + r.width / 2;
    const cy = r.top  + r.height / 2;
    const dx = tx - cx, dy = ty - cy;
    if (!dx && !dy) return { x: cx, y: cy };

    const hw = r.width / 2, hh = r.height / 2;
    const sx = dx ? hw / Math.abs(dx) : Infinity;
    const sy = dy ? hh / Math.abs(dy) : Infinity;
    const s  = Math.min(sx, sy);
    return { x: cx + dx * s, y: cy + dy * s };
  }

  function buildGeometry(a, b) {
    const ca = { x: a.left + a.width/2,  y: a.top + a.height/2 };
    const cb = { x: b.left + b.width/2,  y: b.top + b.height/2 };

    let p0 = borderPoint(a, cb.x, cb.y);
    let p2 = borderPoint(b, ca.x, ca.y);

    let dx = p2.x - p0.x, dy = p2.y - p0.y;
    let d  = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;

    const gapStart = 10, gapEnd = 3;
    p0 = { x: p0.x + ux * gapStart, y: p0.y + uy * gapStart };
    p2 = { x: p2.x - ux * gapEnd,   y: p2.y - uy * gapEnd   };

    dx = p2.x - p0.x; dy = p2.y - p0.y;
    d  = Math.hypot(dx, dy) || 1;

    const mx = (p0.x + p2.x) / 2;
    const my = (p0.y + p2.y) / 2;
    const off = Math.min(46, d * 0.14);
    const p1 = { x: mx - uy * off, y: my + ux * off };

    return { p0, p1, p2 };
  }

  /* ================= СТРЕЛКИ ================= */
  const arrows = [];

  function updateArrow(rec) {
    const sr = stage.getBoundingClientRect();
    const a  = rectOf(rec.a, sr);
    const b  = rectOf(rec.b, sr);
    const { p0, p1, p2 } = buildGeometry(a, b);

    rec.path.setAttribute('d',
      `M ${p0.x} ${p0.y} Q ${p1.x} ${p1.y} ${p2.x} ${p2.y}`);

    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const dl = Math.hypot(dx, dy) || 1;
    const ux = dx / dl, uy = dy / dl;
    const size = 9, wide = 5;
    const bx = p2.x - ux * size, by = p2.y - uy * size;
    const px = -uy, py = ux;

    rec.head.setAttribute('points',
      `${p2.x},${p2.y} ` +
      `${bx + px*wide},${by + py*wide} ` +
      `${bx - px*wide},${by - py*wide}`);
  }

  function createArrow(aEl, bEl) {
    const hex  = aEl.__hex;
    const glow = aEl.__glow;

    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', hex);
    path.setAttribute('stroke-width', '1.8');
    path.setAttribute('stroke-linecap', 'round');
    path.style.filter = `drop-shadow(0 0 6px ${glow})`;

    const head = document.createElementNS(SVGNS, 'polygon');
    head.setAttribute('fill', hex);
    head.style.filter = `drop-shadow(0 0 8px ${glow})`;
    head.style.opacity = '0';
    head.style.transition = 'opacity 0.25s ease';

    const dot = document.createElementNS(SVGNS, 'circle');
    dot.setAttribute('r', '3.2');
    dot.setAttribute('fill', hex);
    dot.style.filter = `drop-shadow(0 0 10px ${hex})`;

    flowLayer.appendChild(path);
    flowLayer.appendChild(head);
    flowLayer.appendChild(dot);

    const rec = { a: aEl, b: bEl, path, head, dot, hex, glow };
    arrows.push(rec);
    aEl.__rec = rec;
    updateArrow(rec);
    return rec;
  }

  async function drawArrow(rec, duration) {
    const L = rec.path.getTotalLength();
    rec.path.style.strokeDasharray  = String(L);
    rec.path.style.strokeDashoffset = String(L);

    await new Promise(resolve => {
      const start = performance.now();
      function frame(now) {
        const t = Math.min(1, (now - start) / duration);
        const e = easeInOutCubic(t);

        rec.path.style.strokeDashoffset = String(L * (1 - e));

        const pt = rec.path.getPointAtLength(L * e);
        rec.dot.setAttribute('cx', pt.x);
        rec.dot.setAttribute('cy', pt.y);

        if (t < 1) requestAnimationFrame(frame);
        else resolve();
      }
      requestAnimationFrame(frame);
    });

    rec.path.style.strokeDasharray  = 'none';
    rec.path.style.strokeDashoffset = '0';

    if (rec.dot && rec.dot.parentNode) {
      rec.dot.style.transition = 'opacity 0.25s ease';
      rec.dot.style.opacity = '0';
      const d = rec.dot;
      setTimeout(() => d.remove(), 300);
      rec.dot = null;
    }
    rec.head.style.opacity = '1';
  }

  function finishArrow(rec) {
    rec.path.style.strokeDasharray  = 'none';
    rec.path.style.strokeDashoffset = '0';
    if (rec.dot && rec.dot.parentNode) { rec.dot.remove(); rec.dot = null; }
    rec.head.style.opacity = '1';
  }

  /* ================= ГЛАВНЫЙ ПРОЦЕСС ================= */
  let skipRequested = false;
  let finished      = false;

  async function runFlow(nodes) {
    const els = nodes.map((spec, i) => {
      const el = buildNode(spec, i);
      nodeLayer.appendChild(el);
      return el;
    });

    await raf();

    statusEl.classList.add('tx');
    statusText.textContent = 'rendering...';

    for (let i = 0; i < els.length; i++) {
      if (skipRequested) break;

      els[i].classList.add('show');
      await sleep(CONFIG.nodeAppear);
      if (skipRequested) break;

      await sleep(CONFIG.beforeType);
      await typeNode(els[i]);
      if (skipRequested) break;

      if (i < els.length - 1) {
        await sleep(CONFIG.arrowDelay);
        if (skipRequested) break;

        const rec = createArrow(els[i], els[i + 1]);
        await drawArrow(rec, CONFIG.arrowDuration);
        if (skipRequested) break;

        await sleep(CONFIG.arrowHold);
      }
    }

    if (skipRequested) finishAll(els);

    statusEl.classList.remove('tx');
    statusEl.classList.add('done');
    statusText.textContent = 'online';
    finished = true;
  }

  function finishAll(els) {
    els.forEach(el => {
      el.classList.add('show');
      el.querySelectorAll('.ch').forEach(c => c.classList.add('on'));
      el.querySelectorAll('.caret').forEach(c => c.remove());
    });

    for (let i = 0; i < els.length - 1; i++) {
      const rec = els[i].__rec || createArrow(els[i], els[i + 1]);
      finishArrow(rec);
    }
  }

  /* ================= ЗАГЛУШКА ================= */
  function showEmpty() {
    nodeLayer.innerHTML = `
      <div class="empty">
        <div class="big">⤓</div>
        <div>не найден <span class="accent">data.js</span></div>
        <div style="font-size:12px;max-width:620px;line-height:1.7;margin-top:8px;">
          создай рядом с index.html файл <span class="accent">data.js</span>:
        </div>
        <pre>window.__FLOW__ = [
  { title: "start",    x: 15, y: 20, color: "green",
    text: ["начало сессии", "клиент запущен"] },
  { title: "select",   x: 50, y: 20, color: "sky",
    text: ["выбор файлов", "список передачи"] },
  { title: "check",    x: 85, y: 20, color: "mauve",
    text: ["проверка канала", "handshake с узлом"] },
  { title: "transfer", x: 85, y: 68, color: "peach",
    text: ["передача данных", "поток чанков"] },
  { title: "verify",   x: 50, y: 68, color: "yellow",
    text: ["сверка хеша", "sha-256 совпал"] },
  { title: "done",     x: 15, y: 68, color: "teal",
    text: ["готово", "файлы на диске"] }
];</pre>
      </div>`;
    statusText.textContent = 'no data';
  }

  /* ================= SKIP ================= */
  function requestSkip() {
    if (finished) return;
    skipRequested = true;
    statusText.textContent = 'skipped';
  }
  document.addEventListener('click', requestSkip);
  document.addEventListener('keydown', requestSkip);

  /* ================= RESIZE ================= */
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      arrows.forEach(rec => {
        if (rec.head && rec.head.parentNode) updateArrow(rec);
      });
    }, 120);
  });

  /* ================= INIT ================= */
  const data = window.__FLOW__;
  if (Array.isArray(data) && data.length) {
    setTimeout(() => runFlow(data), 300);
  } else {
    showEmpty();
  }
</script>
</body>
</html>
