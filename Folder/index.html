<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Folder</title>
<style>
  :root {
    --ctp-base:#1e1e2e; --ctp-mantle:#181825; --ctp-crust:#11111b;
    --ctp-surface0:#313244; --ctp-surface1:#45475a; --ctp-surface2:#585b70;
    --ctp-overlay0:#6c7086; --ctp-overlay1:#7f849c;
    --ctp-text:#cdd6f4; --ctp-subtext0:#a6adc8; --ctp-subtext1:#bac2de;
    --ctp-green:#a6e3a1; --ctp-teal:#94e2d5; --ctp-sky:#89dceb;
    --ctp-blue:#89b4fa; --ctp-lavender:#b4befe; --ctp-mauve:#cba6f7;
    --ctp-pink:#f5c2e7; --ctp-red:#f38ba8; --ctp-peach:#fab387; --ctp-yellow:#f9e2af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: var(--ctp-crust);
    font-family: "JetBrains Mono","Fira Code","SF Mono",Consolas,monospace;
    color: var(--ctp-text);
  }

  /* ---------- ФОН ---------- */
  .bg-layer { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .grid-bg {
    position: absolute; inset: -10%;
    background-image:
      linear-gradient(rgba(137,180,250,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(137,180,250,0.08) 1px, transparent 1px);
    background-size: 48px 48px;
    transform: perspective(600px) rotateX(58deg);
    transform-origin: center bottom;
    animation: gridScroll 24s linear infinite;
    mask-image: radial-gradient(ellipse at 50% 60%, #000 10%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 60%, #000 10%, transparent 75%);
  }
  @keyframes gridScroll {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 48px, 48px 0; }
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; animation: float 18s ease-in-out infinite; }
  .glow.a { width: 480px; height: 480px; background: var(--ctp-mauve); top: -160px; left: -120px; }
  .glow.b { width: 420px; height: 420px; background: var(--ctp-sky); bottom: -140px; right: -120px; animation-delay: -6s; }
  .glow.c { width: 360px; height: 360px; background: var(--ctp-pink); top: 40%; left: 60%; animation-delay: -12s; opacity: 0.35; }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(40px,-30px) scale(1.15); }
  }
  .scanlines-bg {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px,
      transparent 1px, transparent 3px);
    opacity: 0.5;
  }
  .noise {
    position: absolute; inset: 0; opacity: 0.06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }

  /* ---------- РАМКА ОКНА ---------- */
  .stage-wrap {
    position: relative; z-index: 2;
    height: 100vh; padding: 4vh 6vw;
    display: flex; align-items: center; justify-content: center;
  }
  .stage-frame {
    width: 100%; height: 82vh; max-width: 1200px;
    background: rgba(24,24,37,0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--ctp-surface1);
    border-radius: 12px;
    box-shadow:
      0 0 0 1px rgba(203,166,247,0.15),
      0 20px 60px rgba(0,0,0,0.6),
      0 0 80px rgba(137,180,250,0.15),
      inset 0 0 120px rgba(203,166,247,0.05);
    display: flex; flex-direction: column;
    overflow: hidden; position: relative;
    animation: bootIn 0.8s ease-out;
  }
  @keyframes bootIn {
    from { opacity: 0; transform: scale(0.96) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .titlebar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: linear-gradient(180deg, var(--ctp-surface0), var(--ctp-mantle));
    border-bottom: 1px solid var(--ctp-surface1);
    user-select: none; flex-shrink: 0;
  }
  .dots { display: flex; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: var(--ctp-red); }
  .dot.y { background: var(--ctp-yellow); }
  .dot.g { background: var(--ctp-green); }

  .title {
    flex: 1; text-align: center;
    color: var(--ctp-subtext0);
    font-size: 12px; letter-spacing: 0.08em; text-transform: lowercase;
  }
  .title .path { color: var(--ctp-mauve); }
  .title .sep  { color: var(--ctp-overlay0); }

  .status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ctp-green); letter-spacing: 0.05em; }
  .status .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ctp-green);
    box-shadow: 0 0 10px var(--ctp-green);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: 0.4; transform: scale(0.7); }
  }
  .status.tx .pulse { background: var(--ctp-yellow); box-shadow: 0 0 10px var(--ctp-yellow); }
  .status.done .pulse { background: var(--ctp-green); box-shadow: 0 0 10px var(--ctp-green); }

  /* ---------- СЦЕНА / ОКНО ПАПКИ ---------- */
  .stage {
    flex: 1; position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(203,166,247,0.06), transparent 65%),
      var(--ctp-base);
    display: flex; flex-direction: column;
  }

  /* Шапка папки с breadcrumb */
  .folder-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 22px;
    border-bottom: 1px solid var(--ctp-surface1);
    background: linear-gradient(180deg, rgba(24,24,37,0.6), rgba(24,24,37,0.25));
    font-size: 12px;
    flex-shrink: 0;
  }
  .folder-bar .crumb {
    display: flex; align-items: center; gap: 6px;
    color: var(--ctp-mauve);
    letter-spacing: 0.04em;
  }
  .folder-bar .crumb .chev { color: var(--ctp-overlay0); }
  .folder-bar .crumb .leaf { color: var(--ctp-text); }
  .folder-bar .spacer { flex: 1; }
  .folder-bar .count {
    color: var(--ctp-overlay1);
    font-size: 11px;
    letter-spacing: 0.06em;
    padding: 3px 10px;
    border: 1px solid var(--ctp-surface1);
    border-radius: 20px;
    background: rgba(17,17,27,0.5);
    transition: color 0.25s ease, border-color 0.25s ease;
  }
  .folder-bar .count.active {
    color: var(--ctp-yellow);
    border-color: var(--ctp-yellow);
    box-shadow: 0 0 12px rgba(249,226,175,0.35);
  }

  /* Сетка элементов */
  .folder-grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
    padding: 26px 28px 32px;
    align-content: start;
    scrollbar-width: thin;
    scrollbar-color: var(--ctp-surface2) transparent;
  }
  .folder-grid::-webkit-scrollbar { width: 8px; }
  .folder-grid::-webkit-scrollbar-thumb {
    background: var(--ctp-surface2);
    border-radius: 4px;
  }

  /* Элемент: файл или папка */
  .item {
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    gap: 12px;
    padding: 18px 12px 16px;
    border-radius: 12px;
    border: 1px solid transparent;
    background: rgba(49,50,68,0.22);
    cursor: default;
    opacity: 0;
    transform: translateY(18px) scale(0.85);
    transition:
      opacity 0.55s cubic-bezier(.2,.9,.3,1),
      transform 0.65s cubic-bezier(.2,.9,.3,1.15),
      border-color 0.25s ease,
      background 0.25s ease,
      box-shadow 0.3s ease;
    --item-color: var(--ctp-mauve);
    --item-color-glow: rgba(203,166,247,0.45);
  }
  .item.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .item:hover {
    border-color: var(--item-color);
    background: rgba(49,50,68,0.55);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.03) inset,
      0 0 24px var(--item-color-glow),
      0 8px 22px rgba(0,0,0,0.45);
  }

  .item-icon {
    color: var(--item-color);
    filter:
      drop-shadow(0 0 12px var(--item-color-glow))
      drop-shadow(0 5px 10px rgba(0,0,0,0.5));
    transition: transform 0.3s ease;
  }
  .item:hover .item-icon { transform: translateY(-3px); }
  .item-icon svg { display: block; }

  .item-name {
    font-size: 11px;
    line-height: 1.35;
    color: var(--ctp-text);
    text-align: center;
    word-break: break-all;
    letter-spacing: 0.02em;
    max-width: 100%;
  }
  .item-name .base { color: var(--ctp-text); }
  .item-name .ext  { color: var(--item-color); font-weight: 700; }

  .item-badge {
    position: absolute;
    top: 8px; right: 10px;
    font-size: 9px;
    letter-spacing: 0.14em;
    color: var(--ctp-overlay0);
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .item:hover .item-badge { opacity: 1; }

  /* ---------- CRT ---------- */
  .crt {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode: multiply;
    animation: flicker 0.15s infinite;
  }
  @keyframes flicker { 0%{opacity:.92;} 50%{opacity:1;} 100%{opacity:.95;} }

  .vignette {
    position: fixed; inset: 0; z-index: 11; pointer-events: none;
    background: radial-gradient(ellipse at center,
      transparent 40%, rgba(0,0,0,0.35) 85%, rgba(0,0,0,0.75) 100%);
  }
  .beam {
    position: fixed; left: 0; right: 0; height: 120px; z-index: 12; pointer-events: none;
    background: linear-gradient(to bottom, transparent,
      rgba(137,180,250,0.06), rgba(203,166,247,0.10),
      rgba(137,180,250,0.06), transparent);
    animation: beamMove 7s linear infinite;
  }
  @keyframes beamMove { 0%{top:-20%;} 100%{top:110%;} }

  /* ---------- EMPTY ---------- */
  .empty {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    color: var(--ctp-overlay0); font-size: 13px;
    text-align: center; padding: 40px;
  }
  .empty .big { font-size: 42px; color: var(--ctp-mauve); filter: drop-shadow(0 0 20px var(--ctp-mauve)); margin-bottom: 8px; }
  .empty .accent { color: var(--ctp-green); }
  .empty pre {
    text-align: left;
    color: var(--ctp-subtext0);
    font-size: 12px;
    margin-top: 14px;
    background: rgba(0,0,0,0.25);
    padding: 14px 18px;
    border-radius: 8px;
    border: 1px solid var(--ctp-surface1);
    max-width: 90%;
    overflow: auto;
  }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="glow c"></div>
  <div class="grid-bg"></div>
  <div class="scanlines-bg"></div>
  <div class="noise"></div>
</div>

<div class="stage-wrap">
  <div class="stage-frame">
    <div class="titlebar">
      <div class="dots">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      </div>
      <div class="title">
        <span class="path">@artem.grachev</span>
        <span class="sep">:</span>
        <span class="path" id="titlePath">~/folder</span>
        <span class="sep">$</span>
        <span>ls -la</span>
      </div>
      <div class="status" id="status">
        <span class="pulse"></span>
        <span id="statusText">online</span>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="folder-bar">
        <div class="crumb" id="crumb">
          <span class="chev">~</span>
          <span class="chev">/</span>
          <span class="leaf">folder</span>
        </div>
        <div class="spacer"></div>
        <div class="count" id="countBadge">0 items</div>
      </div>
      <div class="folder-grid" id="folderGrid"></div>
    </div>
  </div>
</div>

<div class="crt"></div>
<div class="vignette"></div>
<div class="beam"></div>

<!-- Данные -->
<script src="data.js"></script>

<!-- Логика -->
<script>
  const stage        = document.getElementById('stage');
  const folderGrid   = document.getElementById('folderGrid');
  const status       = document.getElementById('status');
  const statusText   = document.getElementById('statusText');
  const crumb        = document.getElementById('crumb');
  const countBadge   = document.getElementById('countBadge');
  const titlePath    = document.getElementById('titlePath');

  /* ================= НАСТРОЙКИ ================= */
  const CONFIG = {
    betweenItems: 220,   // пауза между появлением элементов
    firstDelay:   300    // задержка перед первым элементом
  };

  /* Цвета по расширению */
  const EXT_COLORS = {
    html: 'peach',
    htm:  'peach',
    css:  'sky',
    scss: 'sky',
    js:   'yellow',
    ts:   'blue',
    jsx:  'yellow',
    tsx:  'blue',
    json: 'green',
    md:   'lavender',
    txt:  'subtext0',
    svg:  'pink',
    png:  'teal',
    jpg:  'teal',
    jpeg: 'teal',
    gif:  'teal',
    webp: 'teal',
    pdf:  'red',
    zip:  'mauve',
    tar:  'mauve',
    gz:   'mauve',
    csv:  'green',
    xml:  'peach',
    yml:  'lavender',
    yaml: 'lavender',
    sh:   'green',
    py:   'sky',
    go:   'teal',
    rs:   'peach',
    c:    'blue',
    cpp:  'blue',
    lock: 'overlay1'
  };

  /* ================= УТИЛИТЫ ================= */
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const raf   = () => new Promise(r => requestAnimationFrame(r));

  function hexToRgba(hex, a) {
    const h = hex.replace('#','');
    const r = parseInt(h.substring(0,2),16);
    const g = parseInt(h.substring(2,4),16);
    const b = parseInt(h.substring(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function getCtpColor(name) {
    const v = getComputedStyle(document.documentElement)
      .getPropertyValue('--ctp-' + name).trim();
    return v || '#cba6f7';
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function colorForFile(name) {
    const dot = name.lastIndexOf('.');
    if (dot < 0) return 'blue';
    const ext = name.slice(dot + 1).toLowerCase();
    return EXT_COLORS[ext] || 'blue';
  }

  /* ================= ИКОНКИ ================= */
  function folderIconSVG() {
    return `
      <svg viewBox="0 0 48 42" width="56" height="48" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 8 a3 3 0 0 1 3 -3 h12 l5 5 h19 a3 3 0 0 1 3 3 v23 a3 3 0 0 1 -3 3 h-36 a3 3 0 0 1 -3 -3 z"
              fill="currentColor" fill-opacity="0.18"
              stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M3 14 h42"
              stroke="currentColor" stroke-width="1.2" opacity="0.55"
              stroke-linecap="round"/>
      </svg>`;
  }

  function fileIconSVG() {
    return `
      <svg viewBox="0 0 40 50" width="46" height="58" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4 a2 2 0 0 1 2 -2 h18 l12 12 v32 a2 2 0 0 1 -2 2 h-28 a2 2 0 0 1 -2 -2 z"
              fill="currentColor" fill-opacity="0.15"
              stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M24 2 l12 12 h-12 z"
              fill="currentColor" fill-opacity="0.4"
              stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <line x1="10" y1="24" x2="30" y2="24" stroke="currentColor" stroke-width="1.5" opacity="0.65" stroke-linecap="round"/>
        <line x1="10" y1="30" x2="30" y2="30" stroke="currentColor" stroke-width="1.5" opacity="0.65" stroke-linecap="round"/>
        <line x1="10" y1="36" x2="22" y2="36" stroke="currentColor" stroke-width="1.5" opacity="0.65" stroke-linecap="round"/>
      </svg>`;
  }

  /* ================= ПУТЬ / BREADCRUMB ================= */
  function setPath(pathStr) {
    titlePath.textContent = pathStr;

    const parts = pathStr.split('/').filter(Boolean);
    crumb.innerHTML = '';
    parts.forEach((p, i) => {
      const span = document.createElement('span');
      const isLast = i === parts.length - 1;
      span.className = isLast ? 'leaf' : 'chev';
      span.textContent = p;
      crumb.appendChild(span);

      if (i < parts.length - 1) {
        const chev = document.createElement('span');
        chev.className = 'chev';
        chev.textContent = '/';
        crumb.appendChild(chev);
      }
    });
  }

  /* ================= СОЗДАНИЕ ЭЛЕМЕНТА ================= */
  function createItem(type, name, colorName) {
    const hex   = getCtpColor(colorName);
    const glow  = hexToRgba(hex, 0.45);

    const el = document.createElement('div');
    el.className = 'item';
    el.style.setProperty('--item-color', hex);
    el.style.setProperty('--item-color-glow', glow);

    const icon = document.createElement('div');
    icon.className = 'item-icon';
    icon.style.color = hex;
    icon.innerHTML = type === 'folder' ? folderIconSVG() : fileIconSVG();

    const nameEl = document.createElement('div');
    nameEl.className = 'item-name';

    if (type === 'file' && name.includes('.')) {
      const dot = name.lastIndexOf('.');
      const base = name.slice(0, dot);
      const ext  = name.slice(dot);
      nameEl.innerHTML =
        `<span class="base">${escapeHtml(base)}</span><span class="ext">${escapeHtml(ext)}</span>`;
    } else {
      nameEl.textContent = name;
    }

    const badge = document.createElement('div');
    badge.className = 'item-badge';
    badge.textContent = type === 'folder' ? 'DIR' : 'FILE';

    el.appendChild(badge);
    el.appendChild(icon);
    el.appendChild(nameEl);
    return el;
  }

  /* ================= ГЛАВНЫЙ ПРОЦЕСС ================= */
  let skipRequested = false;
  let transferDone  = false;

  async function runFolder(data) {
    const items = Array.isArray(data.items) ? data.items : [];

    setPath(data.path || '~/folder');

    status.classList.add('tx');
    statusText.textContent = 'scanning...';

    await raf();
    await sleep(CONFIG.firstDelay);

    let shown = 0;

    for (const raw of items) {
      if (skipRequested) break;

      let type = 'file';
      let name = '';
      let colorName = null;

      if (raw && typeof raw === 'object') {
        if (typeof raw.folder === 'string') {
          type = 'folder';
          name = raw.folder;
        } else if (typeof raw.file === 'string') {
          type = 'file';
          name = raw.file;
        } else if (typeof raw.name === 'string') {
          type = raw.type === 'folder' ? 'folder' : 'file';
          name = raw.name;
        }
        if (raw.color && /^[a-z0-9]+$/i.test(raw.color)) {
          colorName = raw.color.toLowerCase();
        }
      }

      if (!name) continue;

      if (!colorName) {
        colorName = type === 'folder' ? 'mauve' : colorForFile(name);
      }

      const el = createItem(type, name, colorName);
      folderGrid.appendChild(el);

      // force reflow
      void el.offsetWidth;
      el.classList.add('show');

      shown++;
      countBadge.textContent = `${shown} items`;
      countBadge.classList.add('active');

      await sleep(CONFIG.betweenItems);
    }

    countBadge.classList.remove('active');

    if (!skipRequested) {
      status.classList.remove('tx');
      status.classList.add('done');
      statusText.textContent = `${shown} items`;
    } else {
      status.classList.remove('tx');
      status.classList.add('done');
      statusText.textContent = 'skipped';
    }

    transferDone = true;
  }

  /* ================= ЗАГЛУШКА ================= */
  function showEmpty() {
    folderGrid.innerHTML = `
      <div class="empty" style="grid-column:1/-1;">
        <div class="big">⤓</div>
        <div>не найден <span class="accent">data.js</span></div>
        <div style="font-size:12px;max-width:640px;line-height:1.7;margin-top:8px;">
          создай рядом с index.html файл <span class="accent">data.js</span>:
        </div>
        <pre>window.__FOLDER__ = {
  path: "~/projects",
  items: [
    { folder: "src"        },
    { folder: "assets"     },
    { file:   "index.html" },
    { file:   "styles.css" },
    { file:   "app.js"     },
    { file:   "package.json" },
    { file:   "README.md"  },
    { file:   "logo.svg"   },
    { file:   "backup.zip", color: "red" }
  ]
};</pre>
      </div>`;
    statusText.textContent = 'no data';
  }

  /* ================= SKIP ================= */
  function requestSkip() {
    if (transferDone) return;
    skipRequested = true;
  }
  document.addEventListener('click', requestSkip);
  document.addEventListener('keydown', requestSkip);

  /* ================= INIT ================= */
  const data = window.__FOLDER__;
  if (data && Array.isArray(data.items) && data.items.length) {
    setTimeout(() => runFolder(data), 300);
  } else {
    showEmpty();
  }
</script>
</body>
</html>
