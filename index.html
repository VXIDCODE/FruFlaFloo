<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FruFlaFloo :: catalog</title>
<style>
  :root {
    --ctp-base:#1e1e2e; --ctp-mantle:#181825; --ctp-crust:#11111b;
    --ctp-surface0:#313244; --ctp-surface1:#45475a; --ctp-surface2:#585b70;
    --ctp-overlay0:#6c7086; --ctp-overlay1:#7f849c;
    --ctp-text:#cdd6f4; --ctp-subtext0:#a6adc8; --ctp-subtext1:#bac2de;
    --ctp-green:#a6e3a1; --ctp-teal:#94e2d5; --ctp-sky:#89dceb;
    --ctp-blue:#89b4fa; --ctp-lavender:#b4befe; --ctp-mauve:#cba6f7;
    --ctp-pink:#f5c2e7; --ctp-red:#f38ba8; --ctp-peach:#fab387; --ctp-yellow:#f9e2af;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: var(--ctp-crust);
    color: var(--ctp-text);
    font-family: "JetBrains Mono","Fira Code","SF Mono",Consolas,monospace;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- ФОН ---------- */
  .bg-layer { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }

  .grid {
    position: absolute; inset: -10%;
    background-image:
      linear-gradient(rgba(137,180,250,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(137,180,250,0.07) 1px, transparent 1px);
    background-size: 48px 48px;
    transform: perspective(700px) rotateX(56deg);
    transform-origin: center top;
    animation: gridScroll 28s linear infinite;
    mask-image: radial-gradient(ellipse at 50% 10%, #000 5%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 10%, #000 5%, transparent 70%);
  }
  @keyframes gridScroll {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 48px, 48px 0; }
  }

  .glow {
    position: absolute; border-radius: 50%;
    filter: blur(110px); opacity: 0.5;
    animation: float 20s ease-in-out infinite;
  }
  .glow.a { width: 520px; height: 520px; background: var(--ctp-mauve); top: -180px; left: -140px; }
  .glow.b { width: 460px; height: 460px; background: var(--ctp-sky);   bottom: -180px; right: -140px; animation-delay: -7s; }
  .glow.c { width: 380px; height: 380px; background: var(--ctp-pink);  top: 45%; left: 55%; animation-delay: -13s; opacity: 0.3; }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(40px,-30px) scale(1.15); }
  }

  .scanlines-bg {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px,
      transparent 1px, transparent 3px);
    opacity: 0.5;
  }
  .noise {
    position: absolute; inset: 0; opacity: 0.06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }

  /* ---------- РАМКА ОКНА ---------- */
  .stage-wrap {
    position: relative; z-index: 2;
    min-height: 100vh;
    padding: 4vh 5vw 6vh;
    display: flex; justify-content: center;
  }
  .stage-frame {
    width: 100%;
    max-width: 1500px;
    background: rgba(24,24,37,0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--ctp-surface1);
    border-radius: 12px;
    box-shadow:
      0 0 0 1px rgba(203,166,247,0.15),
      0 20px 60px rgba(0,0,0,0.6),
      0 0 80px rgba(137,180,250,0.15),
      inset 0 0 120px rgba(203,166,247,0.05);
    display: flex; flex-direction: column;
    overflow: hidden; position: relative;
    animation: bootIn 0.8s ease-out;
  }
  @keyframes bootIn {
    from { opacity: 0; transform: scale(0.97) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .titlebar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: linear-gradient(180deg, var(--ctp-surface0), var(--ctp-mantle));
    border-bottom: 1px solid var(--ctp-surface1);
    user-select: none; flex-shrink: 0;
  }
  .dots { display: flex; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: var(--ctp-red); }
  .dot.y { background: var(--ctp-yellow); }
  .dot.g { background: var(--ctp-green); }

  .title {
    flex: 1; text-align: center;
    color: var(--ctp-subtext0);
    font-size: 12px; letter-spacing: 0.08em; text-transform: lowercase;
  }
  .title .path { color: var(--ctp-mauve); }
  .title .sep  { color: var(--ctp-overlay0); }

  .status {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--ctp-green);
    letter-spacing: 0.05em;
  }
  .status .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ctp-green);
    box-shadow: 0 0 10px var(--ctp-green);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: 0.4; transform: scale(0.7); }
  }

  /* ---------- ШАПКА ---------- */
  .hero {
    padding: 42px 28px 26px;
    text-align: center;
    border-bottom: 1px solid var(--ctp-surface0);
    position: relative;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(203,166,247,0.06), transparent 70%),
      transparent;
  }
  .hero h1 {
    font-size: clamp(26px, 4.4vw, 46px);
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ctp-mauve);
    text-shadow:
      0 0 10px rgba(203,166,247,0.55),
      0 0 34px rgba(203,166,247,0.25);
  }
  .hero h1 .cursor {
    display: inline-block;
    width: 0.55em; height: 1em;
    margin-left: 0.1em;
    background: var(--ctp-mauve);
    vertical-align: -0.12em;
    box-shadow: 0 0 12px rgba(203,166,247,0.9);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

  .hero p {
    margin: 16px auto 0;
    max-width: 720px;
    color: var(--ctp-subtext0);
    font-size: 13px;
    line-height: 1.75;
    letter-spacing: 0.03em;
  }
  .hero p .accent { color: var(--ctp-green); }
  .hero p .cmd    { color: var(--ctp-sky); }

  /* ---------- СЕТКА КАРТОЧЕК ---------- */
  .grid-cards {
    padding: 34px 28px 44px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 30px;
  }

  /* ---------- КАРТОЧКА ---------- */
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--ctp-mantle);
    border: 1px solid var(--ctp-surface1);
    border-radius: 10px;
    padding: 12px;
    position: relative;
    transition: border-color .2s, box-shadow .2s, transform .2s;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .card:hover,
  .card:focus-visible {
    border-color: var(--ctp-mauve);
    box-shadow:
      0 0 0 1px rgba(203,166,247,0.25),
      0 0 34px rgba(203,166,247,0.22),
      0 12px 32px rgba(0,0,0,0.5);
    transform: translateY(-3px);
    outline: none;
  }
  .card::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: 10px;
    pointer-events: none;
    background: linear-gradient(180deg,
      rgba(203,166,247,0.05), transparent 40%);
    opacity: 0;
    transition: opacity .2s;
  }
  .card:hover::before { opacity: 1; }

  /* ---------- МИНИ-ЭКРАН ---------- */
  .screen {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--ctp-crust);
    border: 1px solid rgba(0,0,0,0.7);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.65);
  }
  .screen iframe {
    position: absolute;
    top: 0; left: 0;
    width: 1280px; height: 720px;
    border: 0;
    transform-origin: top left;
    pointer-events: none;
    filter: saturate(1.1) contrast(1.05);
  }
  .screen::after {
    content: "";
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(to bottom,
        rgba(0,0,0,0.28) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.75) 100%);
    pointer-events: none;
  }

  /* ---------- ПОДПИСЬ КАРТОЧКИ ---------- */
  .meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 4px 2px;
  }
  .card-title {
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ctp-mauve);
    text-shadow: 0 0 10px rgba(203,166,247,0.4);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card:hover .card-title { color: var(--ctp-lavender); }

  .card-num {
    font-size: 11px;
    color: var(--ctp-overlay1);
    letter-spacing: 0.15em;
    flex: none;
  }

  .card-desc {
    padding: 2px 4px 4px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--ctp-subtext0);
    letter-spacing: 0.02em;
  }

  .card-open {
    display: inline-block;
    margin: 8px 4px 2px;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--ctp-green);
    opacity: 0;
    transform: translateX(-6px);
    transition: opacity .2s, transform .2s;
    text-shadow: 0 0 10px rgba(166,227,161,0.6);
  }
  .card:hover .card-open,
  .card:focus-visible .card-open {
    opacity: 1;
    transform: translateX(0);
  }

  /* ---------- ПОДВАЛ ---------- */
  .foot {
    padding: 16px 28px 26px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--ctp-overlay1);
    border-top: 1px solid var(--ctp-surface0);
  }
  .foot .sep { color: var(--ctp-surface2); margin: 0 8px; }
  .foot .accent { color: var(--ctp-green); }

  /* ---------- CRT ---------- */
  .crt {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode: multiply;
    animation: flicker 0.15s infinite;
  }
  @keyframes flicker { 0%{opacity:.92;} 50%{opacity:1;} 100%{opacity:.95;} }

  .vignette {
    position: fixed; inset: 0; z-index: 11; pointer-events: none;
    background: radial-gradient(ellipse at center,
      transparent 42%, rgba(0,0,0,0.35) 85%, rgba(0,0,0,0.75) 100%);
  }
  .beam {
    position: fixed; left: 0; right: 0; height: 120px; z-index: 12; pointer-events: none;
    background: linear-gradient(to bottom, transparent,
      rgba(137,180,250,0.05), rgba(203,166,247,0.09),
      rgba(137,180,250,0.05), transparent);
    animation: beamMove 8s linear infinite;
  }
  @keyframes beamMove { 0%{top:-20%;} 100%{top:110%;} }

  /* ---------- EMPTY ---------- */
  .empty {
    padding: 80px 24px;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    color: var(--ctp-overlay0); font-size: 13px;
    text-align: center;
  }
  .empty .big { font-size: 42px; color: var(--ctp-mauve); filter: drop-shadow(0 0 20px var(--ctp-mauve)); margin-bottom: 8px; }
  .empty .accent { color: var(--ctp-green); }

  @media (max-width: 640px) {
    .stage-wrap { padding: 2vh 3vw 4vh; }
    .grid-cards { padding: 20px 14px 30px; gap: 22px; grid-template-columns: 1fr; }
    .hero { padding: 28px 16px 20px; }
    .hero h1 { letter-spacing: 0.12em; }
  }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="glow c"></div>
  <div class="grid"></div>
  <div class="scanlines-bg"></div>
  <div class="noise"></div>
</div>

<div class="stage-wrap">
  <div class="stage-frame">

    <div class="titlebar">
      <div class="dots">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      </div>
      <div class="title">
        <span class="path">@fruflafloo</span>
        <span class="sep">:</span>
        <span class="path">~/templates</span>
        <span class="sep">$</span>
        <span>ls -la ./catalog</span>
      </div>
      <div class="status" id="status">
        <span class="pulse"></span>
        <span id="statusText">online</span>
      </div>
    </div>

    <header class="hero">
      <h1>FruFlaFloo<span class="cursor"></span></h1>
      <p>
        Набор html-шаблонов для визуализаций с crt-стилистикой
        и эффектом печатающегося текста.<br>
        Выбери визуализацию - она откроется в полном размере.
      </p>
    </header>

    <main class="grid-cards" id="grid"></main>

    <footer class="foot">
      <span class="accent">Copyright (c)</span>
      <span class="sep">//</span>
      2026 Артем Грачев
    </footer>

  </div>
</div>

<div class="crt"></div>
<div class="vignette"></div>
<div class="beam"></div>

<script>
  const grid       = document.getElementById('grid');
  const status     = document.getElementById('status');
  const statusText = document.getElementById('statusText');

  /* ================= НАСТРОЙКИ ================= */
  const CONFIG = {
    previewW: 1280,
    previewH: 720,
    refitDelays: [300, 1200]
  };

  /* ================= ДАННЫЕ ================= */
  const ITEMS = [
    {
      folder: "Background",
      title:  "Background",
      desc:   "Стилизация под CRT-монитор."
    },
    {
      folder: "Chat",
      title:  "Chat",
      desc:   "Анимированная переписка с эффектом набора текста, аватарками и автопрокруткой."
    },
    {
      folder: "Compare",
      title:  "Compare",
      desc:   "Окна сравнения, поддерживает изображения (WebP, PNG, JPG, JPEG, AVIF, SVG, GIF) формата 16:10 (1280×800)."
    },
    {
      folder: "Flow",
      title:  "Flow",
      desc:   "Поочерёдное появление окон (блок-схема) с текстом и анимированными стрелками между ними."
    },
    {
      folder: "Folder",
      title:  "Folder",
      desc:   "Каталог папок и файлов с анимацией и подсветкой элементов."
    },
    {
      folder: "Glitch Loop",
      title:  "Glitch Loop",
      desc:   "Глитч-петля для ascii-графики."
    },
    {
      folder: "Miami Drive",
      title:  "Miami Drive",
      desc:   "Ascii-анимация автомобиля в Майами."
    },
    {
      folder: "Terminal",
      title:  "Terminal",
      desc:   "Терминал с нумерацией строк, мигающим курсором и подсветкой синтаксиса."
    },
    {
      folder: "Terminal - Row selection",
      title:  "Terminal — Row selection",
      desc:   "Терминал с подсветкой синтаксиса и выделением конкретных строк."
    },
    {
      folder: "Terminal - Screen",
      title:  "Terminal — Screen",
      desc:   "Минималистичный экран терминала без подсветки, автоподбор размера шрифта."
    },
    {
      folder: "Terminals",
      title:  "Terminals",
      desc:   "До 4-х терминалов одновременно: нумерация строк, мигающий курсор и подсветка синтаксиса."
    },
    {
      folder: "Transfer",
      title:  "Transfer",
      desc:   "Передача файлов между двумя пк: вылет, полет по дуге и приземление."
    }
  ];

  /* ================= СОЗДАНИЕ КАРТОЧКИ ================= */
  function createCard(item, i) {
    const href = encodeURI(item.folder) + "/index.html";

    const card = document.createElement("a");
    card.className = "card";
    card.href = href;
    card.target = "_blank";
    card.rel = "noopener";
    card.innerHTML = `
      <div class="screen">
        <iframe src="${encodeURI(item.folder)}/index.html"
                scrolling="no"
                loading="lazy"
                tabindex="-1"
                aria-hidden="true"></iframe>
      </div>
      <div class="meta">
        <span class="card-title">${item.title}</span>
        <span class="card-num">${String(i + 1).padStart(2, "0")}</span>
      </div>
      <div class="card-desc">${item.desc}</div>
      <span class="card-open">&gt; открыть</span>
    `;

    return card;
  }

  /* ================= МАСШТАБ ПРЕВЬЮ ================= */
  function fitPreviews() {
    document.querySelectorAll(".screen").forEach(screen => {
      const frame = screen.querySelector("iframe");
      if (!frame) return;
      const w = screen.clientWidth;
      const h = screen.clientHeight;
      if (!w || !h) return;
      const scale = Math.max(w / CONFIG.previewW, h / CONFIG.previewH);
      frame.style.transform = `scale(${scale})`;
      frame.style.left = ((w - CONFIG.previewW * scale) / 2) + "px";
      frame.style.top  = ((h - CONFIG.previewH * scale) / 2) + "px";
    });
  }

  /* ================= INIT ================= */
  function boot() {
    if (!ITEMS.length) {
      grid.innerHTML = `
        <div class="empty">
          <div class="big">⤓</div>
          <div>не найдено ни одной <span class="accent">визуализации</span></div>
        </div>`;
      statusText.textContent = 'no data';
      return;
    }

    ITEMS.forEach((item, i) => grid.appendChild(createCard(item, i)));

    window.addEventListener("resize", fitPreviews);
    window.addEventListener("load", fitPreviews);
    fitPreviews();
    CONFIG.refitDelays.forEach(ms => setTimeout(fitPreviews, ms));
  }

  boot();
</script>
</body>
</html>
