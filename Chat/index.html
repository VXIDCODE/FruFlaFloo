<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Chat</title>
<style>
  :root {
    --ctp-base:#1e1e2e; --ctp-mantle:#181825; --ctp-crust:#11111b;
    --ctp-surface0:#313244; --ctp-surface1:#45475a; --ctp-surface2:#585b70;
    --ctp-overlay0:#6c7086; --ctp-overlay1:#7f849c;
    --ctp-text:#cdd6f4; --ctp-subtext0:#a6adc8; --ctp-subtext1:#bac2de;
    --ctp-green:#a6e3a1; --ctp-teal:#94e2d5; --ctp-sky:#89dceb;
    --ctp-blue:#89b4fa; --ctp-lavender:#b4befe; --ctp-mauve:#cba6f7;
    --ctp-pink:#f5c2e7; --ctp-red:#f38ba8; --ctp-peach:#fab387; --ctp-yellow:#f9e2af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: var(--ctp-crust);
    font-family: "JetBrains Mono","Fira Code","SF Mono",Consolas,monospace;
    color: var(--ctp-text);
  }

  /* ---------- ФОН ---------- */
  .bg-layer { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .grid {
    position: absolute; inset: -10%;
    background-image:
      linear-gradient(rgba(137,180,250,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(137,180,250,0.08) 1px, transparent 1px);
    background-size: 48px 48px;
    transform: perspective(600px) rotateX(58deg);
    transform-origin: center bottom;
    animation: gridScroll 24s linear infinite;
    mask-image: radial-gradient(ellipse at 50% 60%, #000 10%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 60%, #000 10%, transparent 75%);
  }
  @keyframes gridScroll {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 48px, 48px 0; }
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; animation: float 18s ease-in-out infinite; }
  .glow.a { width: 480px; height: 480px; background: var(--ctp-mauve); top: -160px; left: -120px; }
  .glow.b { width: 420px; height: 420px; background: var(--ctp-sky); bottom: -140px; right: -120px; animation-delay: -6s; }
  .glow.c { width: 360px; height: 360px; background: var(--ctp-pink); top: 40%; left: 60%; animation-delay: -12s; opacity: 0.35; }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(40px,-30px) scale(1.15); }
  }
  .scanlines-bg {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px,
      transparent 1px, transparent 3px);
    opacity: 0.5;
  }
  .noise {
    position: absolute; inset: 0; opacity: 0.06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }

  /* ---------- РАМКА ОКНА ---------- */
  .chat-wrap {
    position: relative; z-index: 2;
    height: 100vh; padding: 4vh 6vw;
    display: flex; align-items: center; justify-content: center;
  }
  .chat {
    width: 100%; height: 82vh;
    background: rgba(24,24,37,0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--ctp-surface1);
    border-radius: 12px;
    box-shadow:
      0 0 0 1px rgba(203,166,247,0.15),
      0 20px 60px rgba(0,0,0,0.6),
      0 0 80px rgba(137,180,250,0.15),
      inset 0 0 120px rgba(203,166,247,0.05);
    display: flex; flex-direction: column;
    overflow: hidden; position: relative;
    animation: bootIn 0.8s ease-out;
  }
  @keyframes bootIn {
    from { opacity: 0; transform: scale(0.96) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .titlebar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: linear-gradient(180deg, var(--ctp-surface0), var(--ctp-mantle));
    border-bottom: 1px solid var(--ctp-surface1);
    user-select: none; flex-shrink: 0;
  }
  .dots { display: flex; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: var(--ctp-red); }
  .dot.y { background: var(--ctp-yellow); }
  .dot.g { background: var(--ctp-green); }

  .title {
    flex: 1; text-align: center;
    color: var(--ctp-subtext0);
    font-size: 12px; letter-spacing: 0.08em; text-transform: lowercase;
  }
  .title .path { color: var(--ctp-mauve); }
  .title .sep  { color: var(--ctp-overlay0); }

  .status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ctp-green); letter-spacing: 0.05em; }
  .status .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ctp-green);
    box-shadow: 0 0 10px var(--ctp-green);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: 0.4; transform: scale(0.7); }
  }
  .status.typing .pulse { background: var(--ctp-yellow); box-shadow: 0 0 10px var(--ctp-yellow); }
  .status.done   .pulse { background: var(--ctp-green);  box-shadow: 0 0 10px var(--ctp-green); }

  /* ---------- ЛЕНТА ЧАТА ---------- */
  .chat-body {
    flex: 1; position: relative;
    overflow-y: auto; overflow-x: hidden;
    padding: 28px 36px;
    display: flex; flex-direction: column; gap: 14px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(203,166,247,0.06), transparent 60%),
      var(--ctp-base);
    scrollbar-width: thin;
    scrollbar-color: var(--ctp-surface2) transparent;
  }
  .chat-body::-webkit-scrollbar { width: 10px; }
  .chat-body::-webkit-scrollbar-track { background: transparent; }
  .chat-body::-webkit-scrollbar-thumb {
    background: var(--ctp-surface2);
    border-radius: 5px;
    border: 2px solid var(--ctp-base);
  }
  .chat-body::-webkit-scrollbar-thumb:hover { background: var(--ctp-overlay0); }

  /* ---------- СООБЩЕНИЕ ---------- */
  .msg {
    display: flex; align-items: flex-start; gap: 12px;
    max-width: 78%;
    animation: msgIn 0.32s cubic-bezier(.2,.9,.3,1.3);
  }
  .msg.left  { align-self: flex-start; }
  .msg.right { align-self: flex-end; flex-direction: row-reverse; }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .avatar {
    width: 40px; height: 40px; flex-shrink: 0;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px;
    color: var(--ctp-crust);
    background: var(--u-color, var(--ctp-mauve));
    box-shadow: 0 0 14px var(--u-color, var(--ctp-mauve)),
                inset 0 -4px 8px rgba(0,0,0,0.25);
    border: 2px solid rgba(255,255,255,0.1);
  }

  .bubble-wrap {
    display: flex; flex-direction: column; gap: 4px;
    min-width: 0;
  }
  .msg.right .bubble-wrap { align-items: flex-end; }

  .msg-head {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 11px; letter-spacing: 0.04em;
    padding: 0 4px;
  }
  .msg.right .msg-head { flex-direction: row-reverse; }
  .msg-name {
    color: var(--u-color, var(--ctp-mauve));
    font-weight: 700;
    text-shadow: 0 0 8px var(--u-color, var(--ctp-mauve));
  }
  .msg-time { color: var(--ctp-overlay0); font-size: 10px; }

  .bubble {
    position: relative;
    padding: 10px 14px;
    border-radius: 14px;
    background: var(--ctp-surface0);
    border: 1px solid var(--ctp-surface1);
    color: var(--ctp-text);
    font-size: 14px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    min-width: 44px;
  }
  .msg.left .bubble {
    border-top-left-radius: 4px;
    border-left: 2px solid var(--u-color, var(--ctp-mauve));
  }
  .msg.right .bubble {
    border-top-right-radius: 4px;
    border-right: 2px solid var(--u-color, var(--ctp-mauve));
  }

  .bubble-text { white-space: pre-wrap; }
  .cursor-inline {
    display: inline-block;
    width: 7px; height: 1em;
    background: var(--u-color, var(--ctp-green));
    vertical-align: text-bottom;
    margin-left: 2px;
    box-shadow: 0 0 8px var(--u-color, var(--ctp-green));
    animation: blink 0.9s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }

  /* ---------- «ПЕЧАТАЕТ…» ---------- */
  .msg.typing-ind .avatar { opacity: 0.65; }
  .msg.typing-ind .bubble {
    padding: 12px 16px;
    display: flex; align-items: center; gap: 5px;
    min-height: 36px;
  }
  .typing-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--u-color, var(--ctp-mauve));
    box-shadow: 0 0 8px var(--u-color, var(--ctp-mauve));
    animation: typingBounce 1.2s ease-in-out infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.30s; }
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30%           { transform: translateY(-5px); opacity: 1; }
  }

  /* ---------- CRT ---------- */
  .crt {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode: multiply;
    animation: flicker 0.15s infinite;
  }
  @keyframes flicker { 0%{opacity:.92;} 50%{opacity:1;} 100%{opacity:.95;} }

  .vignette {
    position: fixed; inset: 0; z-index: 11; pointer-events: none;
    background: radial-gradient(ellipse at center,
      transparent 40%, rgba(0,0,0,0.35) 85%, rgba(0,0,0,0.75) 100%);
  }
  .beam {
    position: fixed; left: 0; right: 0; height: 120px; z-index: 12; pointer-events: none;
    background: linear-gradient(to bottom, transparent,
      rgba(137,180,250,0.06), rgba(203,166,247,0.10),
      rgba(137,180,250,0.06), transparent);
    animation: beamMove 7s linear infinite;
  }
  @keyframes beamMove { 0%{top:-20%;} 100%{top:110%;} }

  /* ---------- EMPTY ---------- */
  .empty {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    color: var(--ctp-overlay0); font-size: 13px;
    text-align: center; padding: 40px;
  }
  .empty .big { font-size: 42px; color: var(--ctp-mauve); filter: drop-shadow(0 0 20px var(--ctp-mauve)); margin-bottom: 8px; }
  .empty .accent { color: var(--ctp-green); }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="glow c"></div>
  <div class="grid"></div>
  <div class="scanlines-bg"></div>
  <div class="noise"></div>
</div>

<div class="chat-wrap">
  <div class="chat">
    <div class="titlebar">
      <div class="dots">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      </div>
      <div class="title">
        <span class="path">@artem.grachev</span>
        <span class="sep">:</span>
        <span class="path">~/chat</span>
        <span class="sep">$</span>
        <span>tail -f chat.log</span>
      </div>
      <div class="status" id="status">
        <span class="pulse"></span>
        <span id="statusText">online</span>
      </div>
    </div>

    <div class="chat-body" id="chatBody"></div>
  </div>
</div>

<div class="crt"></div>
<div class="vignette"></div>
<div class="beam"></div>

<!-- Данные -->
<script src="data.js"></script>

<!-- Логика -->
<script>
  const chatBody   = document.getElementById('chatBody');
  const status     = document.getElementById('status');
  const statusText = document.getElementById('statusText');

  /* ================= НАСТРОЙКИ ================= */
  const CONFIG = {
    typingDelay:      1000,   // сколько миллисекунд показывать «печатает…»
    charDelay:        18,     // скорость печати (мс/символ)
    charJitter:       22,     // случайный разброс
    spaceMultiplier:  0.55,
    punctPauses: { '.': 90, ',': 55, '!': 95, '?': 110, ';': 70, ':': 60, '…': 140, '—': 60 },
    betweenMessages:  500,    // пауза между сообщениями
    scrollThreshold:  80      // зона, в пределах которой считаем, что пользователь «у низа»
  };

  const PALETTE = ['mauve','green','sky','peach','pink','teal','lavender','yellow','blue','red'];

  /* ================= УТИЛИТЫ ================= */
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  function formatTime(d = new Date()) {
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    return hh + ':' + mm;
  }

  /* ================= РЕГИСТР ПОЛЬЗОВАТЕЛЕЙ ================= */
  const userRegistry = {};

  function getUser(name, meta) {
    if (userRegistry[name]) return userRegistry[name];
    meta = meta || {};

    const colorName = (meta.color && /^[a-z]+$/i.test(meta.color))
      ? meta.color.toLowerCase()
      : PALETTE[Object.keys(userRegistry).length % PALETTE.length];

    const user = {
      name,
      colorName,
      colorVar: `var(--ctp-${colorName})`,
      avatar: meta.avatar || (name.trim().charAt(0).toUpperCase() || '?'),
      side: meta.side === 'right' ? 'right' : (meta.side === 'left' ? 'left' : null)
    };

    userRegistry[name] = user;
    return user;
  }

  function resolveSides(chatData) {
    const seen = [];
    for (const m of chatData.messages || []) {
      if (!seen.includes(m.user)) seen.push(m.user);
    }
    seen.forEach((n, i) => {
      const u = userRegistry[n];
      if (u && !u.side) {
        u.side = i === 0 ? 'left' : (i === 1 ? 'right' : (i % 2 === 0 ? 'left' : 'right'));
      }
    });
    Object.values(userRegistry).forEach(u => { if (!u.side) u.side = 'left'; });
  }

  /* ================= СОЗДАНИЕ УЗЛОВ ================= */
  function createMessageEl(user) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + user.side;
    wrap.style.setProperty('--u-color', user.colorVar);

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = user.avatar;

    const body = document.createElement('div');
    body.className = 'bubble-wrap';

    const head = document.createElement('div');
    head.className = 'msg-head';
    const nameEl = document.createElement('span');
    nameEl.className = 'msg-name';
    nameEl.textContent = user.name;
    const timeEl = document.createElement('span');
    timeEl.className = 'msg-time';
    timeEl.textContent = formatTime();
    head.appendChild(nameEl);
    head.appendChild(timeEl);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const textEl = document.createElement('span');
    textEl.className = 'bubble-text';
    const cursor = document.createElement('span');
    cursor.className = 'cursor-inline';

    bubble.appendChild(textEl);
    bubble.appendChild(cursor);

    body.appendChild(head);
    body.appendChild(bubble);
    wrap.appendChild(avatar);
    wrap.appendChild(body);

    return { wrap, textEl, cursor };
  }

  function createTypingIndicator(user) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + user.side + ' typing-ind';
    wrap.style.setProperty('--u-color', user.colorVar);

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = user.avatar;

    const body = document.createElement('div');
    body.className = 'bubble-wrap';

    const head = document.createElement('div');
    head.className = 'msg-head';
    const nameEl = document.createElement('span');
    nameEl.className = 'msg-name';
    nameEl.textContent = user.name;
    const infoEl = document.createElement('span');
    infoEl.className = 'msg-time';
    infoEl.textContent = 'печатает…';
    head.appendChild(nameEl);
    head.appendChild(infoEl);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    for (let i = 0; i < 3; i++) {
      const d = document.createElement('span');
      d.className = 'typing-dot';
      bubble.appendChild(d);
    }

    body.appendChild(head);
    body.appendChild(bubble);
    wrap.appendChild(avatar);
    wrap.appendChild(body);
    return wrap;
  }

  /* ================= АВТОСКРОЛЛ ================= */
  let stickToBottom = true;

  chatBody.addEventListener('scroll', () => {
    const dist = chatBody.scrollHeight - chatBody.scrollTop - chatBody.clientHeight;
    stickToBottom = dist <= CONFIG.scrollThreshold;
  }, { passive: true });

  function followBottom() {
    if (stickToBottom) {
      chatBody.scrollTop = chatBody.scrollHeight;
    }
  }

  /* ================= ПЕЧАТЬ ТЕКСТА В БАББЛ ================= */
  async function typeBubble(textEl, cursorEl, fullText) {
    for (let i = 0; i < fullText.length; i++) {
      if (skipRequested) break;
      const ch = fullText[i];
      textEl.textContent += ch;

      let delay = CONFIG.charDelay + Math.random() * CONFIG.charJitter;
      if (ch === ' ') delay *= CONFIG.spaceMultiplier;
      const p = CONFIG.punctPauses[ch];
      if (p) delay += p;

      followBottom();
      await sleep(delay);
    }
    if (skipRequested) textEl.textContent = fullText;
    if (cursorEl && cursorEl.parentNode) cursorEl.parentNode.removeChild(cursorEl);
    followBottom();
  }

  /* ================= ГЛАВНЫЙ ПРОЦЕСС ================= */
  let skipRequested = false;
  let chatDone      = false;

  async function renderChat(chatData) {
    const usersMeta = chatData.users || {};
    const messages  = chatData.messages || [];

    // регистрируем всех заранее, чтобы цвета и стороны зафиксировались
    for (const m of messages) getUser(m.user, usersMeta[m.user] || {});
    resolveSides(chatData);

    status.classList.add('typing');
    statusText.textContent = 'recv...';

    for (let i = 0; i < messages.length; i++) {
      const m = messages[i];
      const user = getUser(m.user, usersMeta[m.user] || {});

      // 1) «печатает…»
      const typingEl = createTypingIndicator(user);
      chatBody.appendChild(typingEl);
      followBottom();
      if (!skipRequested) await sleep(CONFIG.typingDelay);
      typingEl.remove();

      // 2) реальное сообщение
      const { wrap, textEl, cursor } = createMessageEl(user);
      chatBody.appendChild(wrap);
      followBottom();

      if (skipRequested) {
        textEl.textContent = m.text;
        if (cursor.parentNode) cursor.parentNode.removeChild(cursor);
      } else {
        await typeBubble(textEl, cursor, m.text);
      }

      if (!skipRequested) await sleep(CONFIG.betweenMessages);
    }

    chatDone = true;
    status.classList.remove('typing');
    status.classList.add('done');
    statusText.textContent = 'online';
  }

  /* ================= ЗАГЛУШКА ================= */
  function showEmpty() {
    chatBody.innerHTML = `
      <div class="empty">
        <div class="big">⤓</div>
        <div>не найден <span class="accent">data.js</span></div>
        <div style="font-size:12px;max-width:560px;line-height:1.7;margin-top:8px;">
          создай рядом с index.html файл <span class="accent">data.js</span>:
        </div>
        <pre style="text-align:left;color:var(--ctp-subtext0);font-size:12px;margin-top:14px;background:rgba(0,0,0,0.25);padding:14px 18px;border-radius:8px;border:1px solid var(--ctp-surface1);">window.__CHAT__ = {
  users: {
    "Admin": { side: "left",  color: "mauve", avatar: "A" },
    "User":  { side: "right", color: "green", avatar: "U" }
  },
  messages: [
    { user: "Admin", text: "Привет!" },
    { user: "User",  text: "Здравствуйте!" }
  ]
};</pre>
      </div>`;
    statusText.textContent = 'no data';
  }

  /* ================= SKIP ================= */
  function requestSkip() {
    if (chatDone) return;
    skipRequested = true;
    statusText.textContent = 'skipped';
  }
  document.addEventListener('click', requestSkip);
  document.addEventListener('keydown', requestSkip);

  /* ================= INIT ================= */
  const data = window.__CHAT__;
  if (data && Array.isArray(data.messages) && data.messages.length) {
    setTimeout(() => renderChat(data), 300);
  } else {
    showEmpty();
  }
</script>
</body>
</html>
