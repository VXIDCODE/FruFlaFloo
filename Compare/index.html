<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Compare</title>
<style>
  :root {
    --ctp-base:#1e1e2e; --ctp-mantle:#181825; --ctp-crust:#11111b;
    --ctp-surface0:#313244; --ctp-surface1:#45475a; --ctp-surface2:#585b70;
    --ctp-overlay0:#6c7086; --ctp-overlay1:#7f849c;
    --ctp-text:#cdd6f4; --ctp-subtext0:#a6adc8; --ctp-subtext1:#bac2de;
    --ctp-green:#a6e3a1; --ctp-teal:#94e2d5; --ctp-sky:#89dceb;
    --ctp-blue:#89b4fa; --ctp-lavender:#b4befe; --ctp-mauve:#cba6f7;
    --ctp-pink:#f5c2e7; --ctp-red:#f38ba8; --ctp-peach:#fab387; --ctp-yellow:#f9e2af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: var(--ctp-crust);
    font-family: "JetBrains Mono","Fira Code","SF Mono",Consolas,monospace;
    color: var(--ctp-text);
  }

  /* ---------- ФОН ---------- */
  .bg-layer { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .grid {
    position: absolute; inset: -10%;
    background-image:
      linear-gradient(rgba(137,180,250,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(137,180,250,0.08) 1px, transparent 1px);
    background-size: 48px 48px;
    transform: perspective(600px) rotateX(58deg);
    transform-origin: center bottom;
    animation: gridScroll 24s linear infinite;
    mask-image: radial-gradient(ellipse at 50% 60%, #000 10%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 60%, #000 10%, transparent 75%);
  }
  @keyframes gridScroll {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 48px, 48px 0; }
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; animation: float 18s ease-in-out infinite; }
  .glow.a { width: 480px; height: 480px; background: var(--ctp-mauve); top: -160px; left: -120px; }
  .glow.b { width: 420px; height: 420px; background: var(--ctp-sky); bottom: -140px; right: -120px; animation-delay: -6s; }
  .glow.c { width: 360px; height: 360px; background: var(--ctp-pink); top: 40%; left: 60%; animation-delay: -12s; opacity: 0.35; }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(40px,-30px) scale(1.15); }
  }
  .scanlines-bg {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px,
      transparent 1px, transparent 3px);
    opacity: 0.5;
  }
  .noise {
    position: absolute; inset: 0; opacity: 0.06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }

  /* ---------- РАМКА ОКНА ---------- */
  .stage-wrap {
    position: relative; z-index: 2;
    height: 100vh; padding: 4vh 6vw;
    display: flex; align-items: center; justify-content: center;
  }
  .stage-frame {
    width: 100%; height: 82vh;
    background: rgba(24,24,37,0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--ctp-surface1);
    border-radius: 12px;
    box-shadow:
      0 0 0 1px rgba(203,166,247,0.15),
      0 20px 60px rgba(0,0,0,0.6),
      0 0 80px rgba(137,180,250,0.15),
      inset 0 0 120px rgba(203,166,247,0.05);
    display: flex; flex-direction: column;
    overflow: hidden; position: relative;
    animation: bootIn 0.8s ease-out;
  }
  @keyframes bootIn {
    from { opacity: 0; transform: scale(0.96) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .titlebar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: linear-gradient(180deg, var(--ctp-surface0), var(--ctp-mantle));
    border-bottom: 1px solid var(--ctp-surface1);
    user-select: none; flex-shrink: 0;
  }
  .dots { display: flex; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: var(--ctp-red); }
  .dot.y { background: var(--ctp-yellow); }
  .dot.g { background: var(--ctp-green); }

  .title {
    flex: 1; text-align: center;
    color: var(--ctp-subtext0);
    font-size: 12px; letter-spacing: 0.08em; text-transform: lowercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .title .path { color: var(--ctp-mauve); }
  .title .sep  { color: var(--ctp-overlay0); }

  .status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ctp-green); letter-spacing: 0.05em; }
  .status .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--ctp-green);
    box-shadow: 0 0 10px var(--ctp-green);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: 0.4; transform: scale(0.7); }
  }
  .status.tx .pulse { background: var(--ctp-yellow); box-shadow: 0 0 10px var(--ctp-yellow); }
  .status.done .pulse { background: var(--ctp-green); box-shadow: 0 0 10px var(--ctp-green); }

  /* ---------- СЦЕНА ---------- */
  .stage {
    flex: 1; position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 50%, rgba(203,166,247,0.05), transparent 65%),
      var(--ctp-base);
  }

  /* ---------- РЯД СРАВНЕНИЯ ---------- */
  .compare-row {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 3vh 2.4vw;
  }
  .compare-track {
    display: flex; align-items: flex-start; justify-content: center;
    gap: clamp(12px, 1.9vw, 38px);
    width: 100%; max-width: 1560px;
    --node-max: 380px;
  }

  /* ---------- УЗЕЛ ---------- */
  .node {
    flex: 1 1 0; min-width: 0;
    max-width: var(--node-max, 380px);
    display: flex; flex-direction: column; align-items: center;
    opacity: 0;
    --node-color: var(--ctp-mauve);
    --node-glow: rgba(203,166,247,0.45);
    --node-glow-soft: rgba(203,166,247,0.14);
  }
  .node.show { animation: nodeIn 0.85s cubic-bezier(.2,.9,.3,1.15) forwards; }
  @keyframes nodeIn {
    from { opacity: 0; transform: translateY(26px) scale(0.93); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .node .monitor {
    width: 100%; position: relative;
    background: linear-gradient(180deg, #2a2a3a, #1a1a28);
    border: 2px solid var(--node-color);
    border-radius: 12px;
    padding: 10px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.4),
      0 0 34px var(--node-glow),
      0 14px 40px rgba(0,0,0,0.65),
      inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .node .screen {
    position: relative; width: 100%; aspect-ratio: 16 / 10;
    border-radius: 6px; overflow: hidden;
    background:
      radial-gradient(ellipse at 30% 20%, var(--node-glow-soft), transparent 70%),
      var(--ctp-crust);
    border: 1px solid rgba(0,0,0,0.65);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
  }
  .node .screen::before {
    content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background: radial-gradient(ellipse at 30% 20%, var(--node-glow), transparent 72%);
    mix-blend-mode: screen; opacity: 0.4;
  }
  .node .screen::after {
    content: ""; position: absolute; inset: 0; z-index: 6; pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.25) 0 1px, transparent 1px 3px);
    opacity: 0.55;
  }

  .node .shot {
    position: absolute; inset: 0; z-index: 1;
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: opacity 0.4s ease;
  }
  .node .screen.no-img .shot { opacity: 0; }

  .shot-fallback {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--node-color); opacity: 0;
    transition: opacity 0.4s ease;
    text-shadow: 0 0 10px var(--node-glow);
  }
  .node .screen.no-img .shot-fallback { opacity: 1; }
  .shot-fallback svg { filter: drop-shadow(0 0 12px var(--node-glow)); }
  .shot-fallback .fb-name {
    font-size: 9px; letter-spacing: 0.08em;
    color: var(--ctp-overlay1); text-shadow: none;
    max-width: 80%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 4;
    display: flex; align-items: center; gap: 5px;
    padding: 6px 8px 14px;
    background: linear-gradient(180deg, rgba(17,17,27,0.85), transparent);
    font-size: 8px; letter-spacing: 0.16em;
    color: var(--node-color); text-shadow: 0 0 8px var(--node-glow);
    pointer-events: none;
  }
  .hud .led {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--node-color);
    box-shadow: 0 0 8px var(--node-color);
    animation: pulse 1.6s ease-in-out infinite;
  }

  .hud-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 4;
    padding: 16px 8px 6px;
    background: linear-gradient(0deg, rgba(17,17,27,0.9), transparent);
    font-size: 8px; letter-spacing: 0.05em; color: var(--ctp-subtext0);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    pointer-events: none;
  }

  .sweep {
    position: absolute; left: -10%; right: -10%; top: -40%; height: 42%; z-index: 5;
    background: linear-gradient(to bottom, transparent, var(--node-color), transparent);
    filter: blur(6px);
    opacity: 0; mix-blend-mode: screen; pointer-events: none;
  }
  .node.show .sweep { animation: sweepDown 1.5s cubic-bezier(.4,0,.2,1) 0.25s 1 forwards; }
  @keyframes sweepDown {
    0%   { top: -40%; opacity: 0; }
    18%  { opacity: 0.75; }
    100% { top: 115%; opacity: 0; }
  }

  .node .stand {
    width: 18%; height: 16px;
    background: linear-gradient(180deg, #2a2a3a, #1a1a28);
    clip-path: polygon(28% 0, 72% 0, 100% 100%, 0 100%);
    margin-top: -1px;
  }
  .node .base {
    width: 58%; height: 7px;
    background: linear-gradient(180deg, #2a2a3a, #1a1a28);
    border-radius: 4px;
    margin-top: -1px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.55);
  }

  .node-name {
    margin-top: 14px;
    font-size: clamp(12px, 1vw, 17px);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-align: center;
    color: var(--node-color);
    text-shadow: 0 0 14px var(--node-glow);
    opacity: 0; transform: translateY(6px);
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .node-name.in { opacity: 1; transform: none; }

  .specs {
    margin-top: 12px; width: 100%;
    display: flex; flex-direction: column; gap: 5px;
  }
  .spec {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 3px 2px 4px;
    font-size: clamp(9px, 0.74vw, 12px);
    border-bottom: 1px dashed var(--ctp-surface1);
    opacity: 0; transform: translateX(-10px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .spec.in { opacity: 1; transform: none; }
  .spec .k { color: var(--ctp-overlay1); letter-spacing: 0.05em; white-space: nowrap; }
  .spec .k::before { content: "›"; color: var(--node-color); margin-right: 6px; }
  .spec .v { color: var(--ctp-text); text-align: right; word-break: break-word; }

  /* ---------- CRT ---------- */
  .crt {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode: multiply;
    animation: flicker 0.15s infinite;
  }
  @keyframes flicker { 0%{opacity:.92;} 50%{opacity:1;} 100%{opacity:.95;} }

  .vignette {
    position: fixed; inset: 0; z-index: 11; pointer-events: none;
    background: radial-gradient(ellipse at center,
      transparent 40%, rgba(0,0,0,0.35) 85%, rgba(0,0,0,0.75) 100%);
  }
  .beam {
    position: fixed; left: 0; right: 0; height: 120px; z-index: 12; pointer-events: none;
    background: linear-gradient(to bottom, transparent,
      rgba(137,180,250,0.06), rgba(203,166,247,0.10),
      rgba(137,180,250,0.06), transparent);
    animation: beamMove 7s linear infinite;
  }
  @keyframes beamMove { 0%{top:-20%;} 100%{top:110%;} }

  /* ---------- EMPTY ---------- */
  .empty {
    position: absolute; inset: 0; z-index: 8;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    color: var(--ctp-overlay0); font-size: 13px;
    text-align: center; padding: 40px;
  }
  .empty .big { font-size: 42px; color: var(--ctp-mauve); filter: drop-shadow(0 0 20px var(--ctp-mauve)); margin-bottom: 8px; }
  .empty .accent { color: var(--ctp-green); }
  .empty pre {
    text-align: left;
    color: var(--ctp-subtext0);
    font-size: 12px;
    margin-top: 14px;
    background: rgba(0,0,0,0.25);
    padding: 14px 18px;
    border-radius: 8px;
    border: 1px solid var(--ctp-surface1);
  }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="glow c"></div>
  <div class="grid"></div>
  <div class="scanlines-bg"></div>
  <div class="noise"></div>
</div>

<div class="stage-wrap">
  <div class="stage-frame">
    <div class="titlebar">
      <div class="dots">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      </div>
      <div class="title">
        <span class="path">@artem.grachev</span>
        <span class="sep">:</span>
        <span class="path">~/compare</span>
        <span class="sep">$</span>
        <span>tail -f compare.log</span>
      </div>
      <div class="status" id="status">
        <span class="pulse"></span>
        <span id="statusText">online</span>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="compare-row" id="compareRow">
        <div class="compare-track" id="compareTrack"></div>
      </div>
    </div>
  </div>
</div>

<div class="crt"></div>
<div class="vignette"></div>
<div class="beam"></div>

<!-- Данные -->
<script src="data.js"></script>

<!-- Логика -->
<script>
  const stage        = document.getElementById('stage');
  const compareTrack = document.getElementById('compareTrack');
  const status       = document.getElementById('status');
  const statusText   = document.getElementById('statusText');

  /* ================= НАСТРОЙКИ ================= */
  const CONFIG = {
    nodeAppear:   850,   // появление окна
    afterNode:    380,   // пауза до названия
    specDelay:    150,   // задержка между характеристиками
    afterSpecs:   520    // пауза перед следующим окном
  };

  const PALETTE = ['mauve','green','sky','peach','pink','teal','lavender','yellow','blue','red'];

  /* ================= УТИЛИТЫ ================= */
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const raf   = () => new Promise(r => requestAnimationFrame(r));

  function hexToRgba(hex, a) {
    const h = hex.replace('#','');
    const r = parseInt(h.substring(0,2),16);
    const g = parseInt(h.substring(2,4),16);
    const b = parseInt(h.substring(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function getCtpColor(name) {
    const v = getComputedStyle(document.documentElement)
      .getPropertyValue('--ctp-' + name).trim();
    return v || '#cba6f7';
  }

  /* ================= ИКОНКА КАРТИНКИ ================= */
  function fileIconSVG() {
    return `
      <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="9" width="38" height="30" rx="4"
              fill="currentColor" fill-opacity="0.12"
              stroke="currentColor" stroke-width="1.8"/>
        <circle cx="16" cy="20" r="3.4"
                fill="currentColor" fill-opacity="0.55"
                stroke="currentColor" stroke-width="1.4"/>
        <path d="M8 34 L18 24 L26 32 L33 25 L41 34"
              fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
  }

  /* ================= ПОСТРОЕНИЕ УЗЛА ================= */
  function buildNode(item, index) {
    const colorName = (item.color && /^[a-z]+$/i.test(item.color))
      ? item.color.toLowerCase()
      : PALETTE[index % PALETTE.length];
    const hex = getCtpColor(colorName);

    const node = document.createElement('div');
    node.className = 'node';
    node.style.setProperty('--node-color', hex);
    node.style.setProperty('--node-glow', hexToRgba(hex, 0.45));
    node.style.setProperty('--node-glow-soft', hexToRgba(hex, 0.14));

    /* --- монитор --- */
    const monitor = document.createElement('div');
    monitor.className = 'monitor';

    const screen = document.createElement('div');
    screen.className = 'screen';

    const img = document.createElement('img');
    img.className = 'shot';
    img.alt = item.name || '';
    img.src = item.image || '';
    img.addEventListener('error', () => screen.classList.add('no-img'));

    const fallback = document.createElement('div');
    fallback.className = 'shot-fallback';
    fallback.innerHTML = fileIconSVG() + '<span class="fb-name"></span>';
    fallback.querySelector('.fb-name').textContent = item.image || 'no image';

    const hud = document.createElement('div');
    hud.className = 'hud';
    hud.innerHTML = '<span class="led"></span><span class="hud-idx"></span>';
    hud.querySelector('.hud-idx').textContent = 'NODE ' + String(index + 1).padStart(2, '0');

    const hudBottom = document.createElement('div');
    hudBottom.className = 'hud-bottom';
    hudBottom.textContent = item.image || '—';

    const sweep = document.createElement('div');
    sweep.className = 'sweep';

    screen.append(img, fallback, hud, hudBottom, sweep);
    monitor.appendChild(screen);

    const stand = document.createElement('div');
    stand.className = 'stand';
    const base = document.createElement('div');
    base.className = 'base';

    /* --- название --- */
    const nameEl = document.createElement('div');
    nameEl.className = 'node-name';
    nameEl.textContent = item.name || ('NODE ' + (index + 1));

    /* --- характеристики --- */
    const specs = document.createElement('div');
    specs.className = 'specs';
    (item.specs || []).forEach(s => {
      const row = document.createElement('div');
      row.className = 'spec';
      const k = document.createElement('span');
      k.className = 'k';
      const v = document.createElement('span');
      v.className = 'v';
      if (typeof s === 'string') {
        k.textContent = '';
        v.textContent = s;
      } else {
        k.textContent = (s.k !== undefined) ? s.k : '';
        v.textContent = (s.v !== undefined) ? s.v : '';
      }
      row.append(k, v);
      specs.appendChild(row);
    });

    node.append(monitor, stand, base, nameEl, specs);
    return node;
  }

  /* ================= РАСКРЫТИЕ ================= */
  function revealNode(node) {
    node.classList.add('show');
  }
  function revealAll(nodes) {
    nodes.forEach(n => {
      n.classList.add('show');
      const name = n.querySelector('.node-name');
      if (name) name.classList.add('in');
      n.querySelectorAll('.spec').forEach(s => s.classList.add('in'));
    });
  }

  /* ================= ГЛАВНЫЙ ПРОЦЕСС ================= */
  let skipRequested = false;
  let transferDone  = false;
  let currentNodes  = [];

  async function runCompare(data) {
    const items = (data.items || []).filter(Boolean).slice(0, 4);
    const count = items.length;

    compareTrack.style.setProperty('--node-max',
      count === 2 ? '430px' : count === 3 ? '380px' : '330px');

    status.classList.add('tx');
    statusText.textContent = 'comparing...';

    currentNodes = items.map((it, i) => buildNode(it, i));
    currentNodes.forEach(n => compareTrack.appendChild(n));

    await raf();
    await sleep(120);

    for (let i = 0; i < currentNodes.length; i++) {
      if (skipRequested) break;

      const node = currentNodes[i];
      statusText.textContent = `node ${i + 1}/${currentNodes.length}`;

      // 1) окно
      revealNode(node);
      await sleep(CONFIG.nodeAppear);
      if (skipRequested) break;

      // 2) название
      await sleep(CONFIG.afterNode);
      const nameEl = node.querySelector('.node-name');
      if (nameEl) nameEl.classList.add('in');
      await sleep(320);
      if (skipRequested) break;

      // 3) характеристики
      const specs = node.querySelectorAll('.spec');
      for (const s of specs) {
        if (skipRequested) break;
        s.classList.add('in');
        await sleep(CONFIG.specDelay);
      }
      if (skipRequested) break;

      await sleep(CONFIG.afterSpecs);
    }

    if (skipRequested) {
      revealAll(currentNodes);
    }

    status.classList.remove('tx');
    status.classList.add('done');
    statusText.textContent = 'online';
    transferDone = true;
  }

  /* ================= ЗАГЛУШКА ================= */
  function showEmpty() {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = `
      <div class="big">⌗</div>
      <div>не найден <span class="accent">data.js</span> или меньше двух узлов</div>
      <div style="font-size:12px;max-width:640px;line-height:1.7;margin-top:8px;">
        создай рядом с index.html файл <span class="accent">data.js</span>:
      </div>
      <pre>window.__COMPARE__ = {
  items: [
    {
      image: "img/node-a.png",
      name:  "NODE A",
      color: "sky",
      specs: [
        { k: "cpu",   v: "8 ядер" },
        { k: "ram",   v: "32 GB" },
        { k: "цена",  v: "1200 $" }
      ]
    },
    {
      image: "img/node-b.png",
      name:  "NODE B",
      color: "peach",
      specs: [
        { k: "cpu",   v: "16 ядер" },
        { k: "ram",   v: "64 GB" },
        { k: "цена",  v: "2400 $" }
      ]
    }
  ]
};</pre>`;
    stage.appendChild(empty);
    statusText.textContent = 'no data';
  }

  /* ================= SKIP ================= */
  function requestSkip() {
    if (transferDone) return;
    skipRequested = true;
    revealAll(currentNodes);
    status.classList.remove('tx');
    status.classList.add('done');
    statusText.textContent = 'online';
    transferDone = true;
  }
  document.addEventListener('click', requestSkip);
  document.addEventListener('keydown', requestSkip);

  /* ================= INIT ================= */
  const data = window.__COMPARE__;
  const items = (data && Array.isArray(data.items)) ? data.items.filter(Boolean) : [];
  if (items.length >= 2) {
    setTimeout(() => runCompare(data), 300);
  } else {
    showEmpty();
  }
</script>
</body>
</html>
